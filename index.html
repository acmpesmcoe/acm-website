<!doctype html>
<html lang="en">
  <script>
      (function() {
        var stored = localStorage.getItem('acm-theme');
        var prefersLight = window.matchMedia('(prefers-color-scheme: light)').matches;
        if (stored === 'light' || (!stored && prefersLight)) {
          document.documentElement.classList.add('light');
        }
      })();
    </script>
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/acm-favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ACM PES MCOE — Association for Computing Machinery</title>
    <meta name="description" content="Official chapter of the Association for Computing Machinery at PES Modern College of Engineering, Pune." />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  </head>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
